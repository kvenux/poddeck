summary: |
  Lewis Hu 在 SpaceX 工作 7 年,离开时管 7 个部门、三千多个火箭部位。
  这期围绕 2026 年 SpaceX 收购 xAI 与即将 IPO 的时间点,讲清楚 SpaceX
  为什么从来不是一家"火箭公司"——它的真正拐点是 2015 年 12 月 21 日
  的第一次回收,而星链、太空数据中心、星舰都是同一个"开拓宇宙"长期
  规划下的逻辑推论。也包含 Lewis 食品 → 火箭的转身、Elon 三种开会
  方式、"我接受你的辞呈"、可乐罐故事,以及他作为投资人对 SpaceX Mafia
  和"太空 + 地球一体系统"的判断。
core_ideas:
  - SpaceX 真正的拐点是 2015-12-21 第一次回收,不是 2026 的 IPO + xAI 整合
  - SpaceX 从不把自己定位成火箭公司——火箭只是手段,目标是"开拓宇宙"
  - 为什么是 SpaceX 收 xAI 而不是 Tesla:美国电网 30 年老化 + permit 瓶颈,太空才有无尽能源和无尽空间
  - 送 1 公斤上太空成本从两万降到三千,星舰目标一百以下——以前的天方夜谭"在账上算得过来"
  - SpaceX 1000 人 vs 波音 / Lockheed 10000 人做同一件事;Elon 的"十倍级 / 百倍级"标准
  - Elon 只跟你开三种会:东西迟到了 / 做不出来 / 要更多的钱;没有定期会议
  - 太空是唯一一个全球必须一起合作的地方——中美都会是参与者,但太空空间本身没有国界
