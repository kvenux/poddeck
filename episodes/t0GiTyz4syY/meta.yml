summary: |
  Elizabeth Stone 解释了 Netflix 为什么在 AI 时代更需要 systems thinkers：更多人和 agent 能跨职能构建后，source of truth、paved paths、设计系统与责任机制成为规模化速度的前提。她同时强调专业 craft、初级人才培养和人类判断不会消失，并把 Netflix 的人才密度、自治、问责与轻流程概括为一套追求卓越的组织操作系统。
core_ideas:
  - AI 扩大了 PM、设计、数据科学与工程的行动半径，但最终结果仍由人负责
  - Systems thinking 把局部功能提升为可复用平台、统一护栏与连贯用户体验
  - 窄专精的需求下降，关键领域专家仍有价值，但必须能学习并扩展边界
  - AI fluency 是覆盖所有角色的组织级期待，重点是探索、判断与责任
  - Netflix 以人才密度、自治、问责、风险承受和轻流程维持卓越
  - AI 扩大娱乐制作与分发能力，但创作者和人类故事仍位于中心
