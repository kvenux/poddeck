summary: |
  Anjney Midha 把 Amp 定位成 AI 算力的"独立系统运营商"（ISO）——参照美国电网 PJM Interconnection 的模型，做 pooling、调度，但自己不持有资产。
  他认为现在很多有钱有算力的 AI lab 仍出不了东西，根因不是技术，是 culture：mission alignment 在快速 scaling 中被稀释，半导体行业沉淀几十年的 iterative bring-up 纪律被 AI 例外论抛弃。
  全集还覆盖了 Anthropic 起飞的"prepared mind"逻辑、Anthropic 的 21 nos、Net-positive 数据中心的 $0.50 设想、DeepMind 6 个月 embargo 的市场失灵，以及他自己 14 年放不下的副线——end-of-life prediction。
core_ideas:
  - "诊断：有钱有 GPU 还不能 ship 的 AI lab，问题在 culture——mission alignment 在 scale 中被稀释，radian metaphor"
