summary: |
  叶奇意从月之暗面 A1 轮的寻找与决策讲起，回望中国两代 AI 公司之间的人才、组织经验与理想主义传承。对谈进一步讨论了 AI 1.0 的泛化与商业化困境、K3 带来的评价坐标变化，以及模型能力商品化之后真正值得构建的产品环境。
core_ideas:
  - 人才与对 AGI 的信念，是早期寻找模型创业团队的首要锚点
  - AI 1.0 的泛化不足，使业务扩张伴随研发、交付和管理成本上升
  - 两代 AI 公司通过实验室、创业团队与工程网络完成十年人才迁徙
  - 模型领先提供的是有限时间窗口，长期壁垒来自可持续产生反馈与新智能的环境
  - 下一代 AI 产品需要让普通人更平等地获得智能，而非只服务输入框高手
