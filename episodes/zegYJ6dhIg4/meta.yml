summary: |
  Adam Ward 解释了为什么传统招聘漏斗会把团队带向平均水平，并给出一套从 scoping、market mapping、持续激活到 work sample 与 closing 的逐人招聘系统。
  这期对谈也把人才密度从明星个体重新定义为团队属性，并讨论第一位 recruiter、offer 后 preboarding 与 talent engineer 的新角色。
core_ideas:
  - 先定义顶尖人才对当前角色意味着什么，再用评估流程验证，而不是从大漏斗里录用剩余者
  - 用具体能力问题、可信网络与持续人工挖掘，建立小而清晰的目标人才清单
  - Recruiter 提供决策信心，hiring manager 对录用结果负责，founder 必须投入时间
  - Work sample 应同时给公司与候选人真实信号，候选人体验会形成下一轮招聘飞轮
  - Closing 从第一次理解动机开始，高价值候选人的推进是一项团队运动
  - 人才密度来自互补团队与支持环境，招聘团队本身也需要高 craft、高 motor 与团队优先
