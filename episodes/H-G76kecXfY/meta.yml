summary: |
  硅谷101 拆解 Palantir——这家从美军情报订单起家、帮助找到本·拉登、
  如今以"AI Agent + 数据本体论"切入大企业市场的神秘公司。本期梳理它
  的四大产品线(Gotham / Foundry / AIP / Apollo)、与传统 SaaS 反着
  来的定制化打法、以及背后 Alex Karp 与 Peter Thiel 代表的硅谷右翼浪
  潮——为什么市盈率 520 倍的 Palantir 被散户追捧为"AI 信仰股"和
  "MAGA 国运股"。
core_ideas:
  - Palantir 起家靠"中层指挥官即销售"的渗透打法,2019 年成为首家主导国防项目的民营软件公司
  - 反 SaaS 的定制化路线——派工程师驻场建"数字孪生",空客造飞机的 ROI 提升 25 倍
  - 四大产品线:Gotham(军方) Foundry(商业) AIP(Agent 交互层) Apollo(部署与数据安全)
  - 本体论 Ontology 是核心护城河——存"关系"而非数据本身,把现实结构搬进虚拟世界
  - AIP 把使用门槛"从天上拉到地下",松下能源用 Atom 让新人维修团队从 3-6 个月缩短到几周
  - 商业部门订单收入年增 71% 反超政府的 45%,但 PE 高达 520 倍,价格已 price in 到 2028 年
  - 背后是硅谷右翼崛起——Karp + Thiel + Musk + Andreessen 联手,梦想把科技创新拉回国防生态
