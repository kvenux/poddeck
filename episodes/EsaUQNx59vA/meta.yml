summary: |
  田渊栋在 Meta 10 月 600 人 AI 裁员风波中被裁，被裁前已有 offer。在这场访谈里，他坦诚谈了对 LLM 路线、Scaling Law、RL 与 SFT、AI 人才市场的判断，回顾了在 FAIR 十年最大的收获——research taste，并谈到他想成为"超级研究员"的下一步设想。
core_ideas:
  - '做 AI 的人会越来越少，用 AI 做工具的人会越来越多是行业大趋势，不只是 Meta 一家'
  - LLM 是有意思的路线但不一定是正确的——人与模型之间还有 1000 倍的 token 效率差距
  - Scaling Law 是一个悲观的未来——指数级资源消耗换线性能力提升，地球能源都不够烧
  - 梯度下降可能并不是最优的训练范式——"这是我的一个暴论"
  - 强化学习的核心是"主动学习"而非神秘范式——本质是主动采集数据 vs 被动喂数据
  - 同意 Karpathy："我们是进入了以十年为尺度的时代，而不是立即获得 AGI"
  - FAIR 十年最大的收获是 research taste——意味着自己给自己设一条道路
  - 大厂研究不会消失，但形式会更像"游击战"——分散在各个组、各个 startup
