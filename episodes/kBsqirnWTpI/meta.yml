summary: |
  阳萌掌舵的安克创新从充电宝起家，市值 600+ 亿。但他想做的不是一家"做生意的公司"，而是一家"做深科技的公司"——
  从 2022 年 27 个产品线打不赢独角兽的低谷，到 2026 年发布自研存算一体芯片让百万参数端到端降噪模型跑在耳塞里，
  再到看家狗、户用储能、AI 中台、N 倍效能组织——这期访谈把这条路径从战略框架到执行细节全部摊开。
  核心是几个抽象框架：1357 人群分层、浅海/深海品类、第三类公司（总统+联邦）、第一性/求极致/共成长，
  以及他对 AI 时代组织变革、价值分配（创造者拿 7）和 CEO 哲学（养娃 vs 养猪）的完整论述。
core_ideas:
  - 第三类公司路径——苹果是"少量超级品类"的第一类，多数公司是"少量中小品类"的第二类，安克要做"几十个中小品类、每个都做好"的第三类（宝洁/索尼/德州仪器/耐克路线），靠总统+联邦而非国王+骑士团
  - 1357 人群分层——同一群消费习惯的人跨品类是同一档号位，安克前十年是"海外的小米"那种 5 系公司，下一台阶是 7 系（极致创新）
  - 浅海/深海的盲注隐喻——市场规模决定德州扑克盲注，浅海几百万人民币一注，深海 5-10 亿一注，所以"不碰手机汽车"是有道理的直觉
  - 存算一体芯片——为让百万参数端到端降噪模型跑在耳塞里，从冯诺依曼的存算分离转到大脑式的存算一体，2023 立项、2026 上市
  - 智能家居三阶段——不可调 → 可调节可预设 → 自调节，今天市面上几乎所有"智能家居"都还停在第二阶段
  - 三层护城河——领先技术（会被人感知极限封顶）→ 品牌信任（错一次永久失去）→ 使命愿景+一群相信的人（唯一可复利的护城河）
  - AI 时代组织三板斧——人拥抱 AI、能力沉淀为预编排智能体、组织变革；公司内部一天 1500 亿 token，年费用小几个亿
  - 大 new 人 / 小 new 人——少量造斧子的人（沉淀智能体）+ 大量用斧子的人，组成 N 倍效能组织
  - 中层管理者不会消失——把整家公司讲清楚需要超过百亿 context，模型还做不好"留什么压缩什么"的价值选择；康威定律也保护了管理者的不可委托性
  - 创造者拿 7、股东拿 3——一流公司有 30% 总剩余价值，股东合理拿 10%，剩下 20% 给创造者，正好 7:3
  - 中庸即中成——五档下注里阳萌选 3 档（投超过一半），长期博弈下"中间会通向成功"，反对中庸 = 平庸的解读
  - 公司是养娃不是养猪——养娃的目的是让它活得比你久；安克所有的痛苦转型都是因为想让它活久
