  半导体分析师 Doug O'Laughlin (SemiAnalysis) 上 Latent Space 分享他被 Claude Code 4.5 击穿的故事——从投研工作流的重写、Excel/Bloomberg 之死,到全球 HBM/DRAM 内存荒 (4:1 转换比、DRAM 现货价可能再翻一倍)、Microsoft 在 AI 时代的两难、Codex 5.3 的反扑、TPU V7 的市场窗口,以及 6 个月徒步 Continental Divide Trail 教会他的 self-mastery。
core_ideas:
