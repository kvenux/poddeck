  - 'Microsoft 有最多东西可失: "renting barbarians at the gate" —— Azure 每年武装的对手,正在挖 Office 家族的墙脚'
  - HBM 4:1 榨汁比 + 三年零扩产 = 自 1996 年以来最严重的内存短缺 —— DRAM 价格可能再涨 100%,iPhone 现货价将随之上涨
