summary: |
  Yaroslav Azhnyuk在旧金山创立了Pet Cube——"向宠物投射零食的摄像头"——然后，在俄罗斯入侵的前夜搭上飞往基辅的最后一班飞机（2022年2月23日），转型投身无人机自主系统、热成像摄像头和FPV攻击无人机的研发，服务于乌克兰武装力量。他与Noah Smith和Latent Space的Brandon共同梳理了无人机自主性五级体系、自主战场的八个维度、FPV如何取代炮兵成为"战争之神"（约80%的前线伤亡），以及中国无人机制造规模令人不安的数字（乌克兰年产400万架FPV，中国产能约40亿架）。
core_ideas:
  - 软件定义战争——无人机舰队可以通过OTA在一夜之间获得新行为，这在军事史上是第一次（"推送一个软件更新，让你所有的罗马军团士兵获得新头盔"）
  - 无人机自主性五级——末端制导→轰炸→目标检测→导航→起降；灵感来自SAE自动驾驶级别
  - 自主战场的八个维度——级别、平台、领域、集群、环境、指挥与控制、基础设施、规模
  - 仅凭L1（末端制导），一名乌克兰飞手的任务成功率从20%提升到71%，杀伤区从3公里扩大到10公里
  - FPV无人机是战争之神——前线70–80%的伤亡现在由FPV造成；炮兵被取代但并未消亡
  - 成本不对称——500美元的FPV对500万美元的坦克；Vyriy Drone的Alexei Babenko关于一天产量足以摧毁莱茵金属一年产量坦克的引言
  - 光纤价格从每公里4美元涨到32美元——因为AI数据中心消耗的是同款光纤
  - 5–10年后，不用AI的武器将是不道德的——精准度论证
  - 中国产能的悬剑——乌克兰年产400万架FPV对中国40亿架产能；集装箱船远程无人机投送作为战略场景
  - 西方落后的四个层面——自主技术、大规模制造、零部件、稀土精炼
  - 无人机时间差异——乌俄在一年内推进了约一年的无人机技术；欧洲"从2022年冬天走到了2022年春天"
  - 基辅——国防谷；亚瑟·C·克拉克的"未来已经到来，只是分布不均"应用于军事技术
  - Si vis pacem, para bellum——结束语：想要和平，就要备战
