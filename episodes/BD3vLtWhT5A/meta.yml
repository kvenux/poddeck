summary: |
  Benedict Evans 在 Lenny 的节目上展开了他最新的 "AI is eating the world"
  演示——一份"80 页都在说 we don't know"的冷静分析。他给出三组核心判断：
  我们处于 1997 年互联网那种"看得见大方向、看不清谁会赢"的早期阶段；
  task ≠ job，所以 17% 自动化分析都是 horseshit；基础模型很可能像电信运营商
  ——重要、伟大、毛利率很低，价值会沿着 stack 往上流到应用层。
core_ideas:
