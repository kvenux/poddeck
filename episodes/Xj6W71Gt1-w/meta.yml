core_ideas:
  - Physical AI 是 CES 2026 最重要的关键词，汽车是最直接的落地场景——从"看见世界"到"真正理解世界"的跃迁
  - 吉利首发 WAM 世界行为模型，由 MLLM 决策大脑 / Action Expert 执行小脑 / World Model 预测模拟器 / 价值函数评价官四角色协同
  - 生态闭环的运行逻辑：传感器 → 端侧算力 → 架构 → 数据中心 → 卫星 → 具身智能，让车从硬件产品变成"出行智慧生命体"
  - 数据量决定模型上限——特斯拉 2025 全年 163.6 万 vs 吉利 302 万（其中 NEV 168.8 万），吉利训练数据已经反超
  - '上天入地的物理底座——算力大联盟 23.5 EFlops 居中国车企第一、吉利星座 64 颗卫星完成组网'
  - 车是"轮式机器人"——研究机器人和训练自动驾驶底层技术相通，布局机器人是"为下一个时代买门票"
  - 全球汽车业分流：中国"速度与智能化" vs 欧美"品牌与工程深度"，奔驰宝马深陷康威定律；吉利的"双栖"特质或是它最大筹码
