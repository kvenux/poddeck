  硅谷101 陈茜在 CES 2026 现场探展，以 Physical AI 为主线串起 NVIDIA Alpamayo、宝马 Alexa+、博世/LG 智能座舱等西方阵营动作，
  随后深度解剖吉利全域 AI 2.0 与 WAM 世界行为模型如何把"单点智能"升级到"整体涌现"——并通过"上天入地"的生态布局
