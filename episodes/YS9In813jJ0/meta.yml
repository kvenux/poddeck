summary: |
  Jen Abel 用一笔向大型企业法务团队销售 10 万美元方案的假想交易，逐步拆开从首次触达到签字的完整流程。
  重点不只是十四个动作，而是如何持续获得信息优势、与 champion 共同设计 demo 和 pilot，并守住定价、采购与扩张节奏。
core_ideas:
  - 企业销售应贴合买方的决策过程，而不是把客户塞进五个 CRM 阶段
  - 只从 C-level 与 N−1 双线切入，用高管价值和 alpha 压缩首次叙事
  - Intro、follow-up、pre-demo 与 post-demo 都是在累积无法被竞争对手复制的信息优势
  - Demo 只展示能承载核心价值的产品切片，pilot 则要限定用户、任务、时长与成功标准
  - 健康企业胜率约为 25–35%，过高可能意味着价格过低
  - Procurement、papering 与 signature 是付款路径，签字后要立刻转向 expansion
