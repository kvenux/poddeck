summary: |
  硅谷101 对"世界模型"的体系化梳理：从 1943 年 Kenneth Craik 的心智模型、1991 年 Sutton 的 Dyna 架构，到 2018 年 David Ha × Schmidhuber 的 V+M+C 框架，再到当下行业三大路线——视频生成（Sora · Genie 3）、3D 生成（World Labs · Marble）、JEPA（Yann LeCun），以及在游戏/机器人/自动驾驶上的应用。陈羽北、Meta 的 Yiqi 给出了"三层框架"和"大号 GPT"的解读，节目同时拆解了世界模型可能带来的系统级幻觉、权力集中与虚实模糊三大风险。
core_ideas:
  - 世界模型 = V（视觉）+ M（记忆/想象）+ C（控制）—— 它的核心是让 AI 在"内部世界的梦境"里训练再在现实里执行
  - Yann LeCun 公开断言"再过 5 年 GPT 之类的大语言模型就不会再有人用了"，并认为 AGI 最乐观也要 5 到 10 年才能接近一只狗的智能
  - Yiqi 的三层框架把整个领域拆为：底层范式（Latent MDP / Simulator）/ 中层表现（世界生成）/ 顶层目的（智能体训练），目前业界最热闹的都是中层
  - 生成路线两大派别：视频派 scale-driven 但物理"藏在权重里"；3D 派显式建几何但数据贵、算力贵，World Labs 一年半估值飙到 50 亿美元
  - JEPA 路线（LeCun）不画像素只学结构——理论优美但不可见、目标难设计、缺统一 benchmark，仍像"前额叶原型"
  - 产业冲击：机器人获得迁移能力、自动驾驶从"反应"走向"预判"（Waymo 已构建 Foundation Model）、内容产业从"制作"走向"生长"、Agent 第一次有了可大规模试错的"内在世界"
  - 风险也变成系统级：模型幻觉直接影响行动后果、世界模型能力可能高度集中于极少数机构、虚实边界开始模糊
