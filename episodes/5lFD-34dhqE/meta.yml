summary: |
  Alex Krentsel 解释 Exo 如何把 agent 拆成无状态 executive、受保护 harness 与隔离 sandbox，使 policy 可以在运行时查看并修改自己的代码。对谈进一步讨论自动回滚、秘密隔离、可迁移执行、可中断任务，以及自我优化为何必须受到 eval 约束。
core_ideas:
  - Agent harness 正成为模型可以直接读取、编写和优化的软件层
  - 无状态 executive、受保护 harness 与隔离 sandbox 形成三个信任区域
  - Guardian 通过重建、一步试运行和自动回滚保护运行时自编辑
  - 成本日志能驱动自我优化，但单一目标会诱发 reward hacking
  - 代码既是模型生成的产物，也是 harness 当前运行的材料
