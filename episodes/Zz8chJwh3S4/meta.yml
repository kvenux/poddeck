summary: |
  Ido Portal 把 movement practice 从每天的一段锻炼，扩展为贯穿注意、语言、情绪、关系与日常动作的持续练习。对谈重点拆解了玩心、纪律和意志的差别，身体与情绪分辨率的退化，以及人在过渡点、矛盾状态与不确定环境中如何更新自己的模型。
core_ideas:
  - 正式训练的目标是进入非正式生活，让喝水、坐下、倾听与走路都成为更新身体模型的机会
  - 纪律与动机能搭脚手架，意志则在不想做时通过柔软、选择和连续性被显露
  - 玩心改变进入任务的路径，能提升在场感、保留能量，并让普通经历获得更高分辨率
  - 身体、情绪、语言、社交与空间模型都需要持续细化，否则会压缩成僵硬的二元分类
  - 真正的技能允许轨迹变化、适应新条件并守住结果，美感是功能组织的副产品
