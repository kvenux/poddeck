summary: |
  Harvey Friedman — the youngest professor in recorded history (a Stanford appointment at 18)
  and the author of the last paper Kurt Gödel sponsored for PNAS — gives his first podcast.
  The conversation moves from Gödel's two often-conflated incompleteness theorems to Friedman's
  60-year program to push incompleteness out of set-theoretic exile and into the kind of finite,
  combinatorial mathematics that working mathematicians cannot dismiss. Along the way: TREE(3),
  the divine consistency proof, embedded maximality, and a quiet meditation on AI as a form of
  immortality.
core_ideas:
  - Gödel's first and second incompleteness theorems are distinct claims and the popular "we can't know anything for sure" reading is wrong
  - Friedman's program is "tangible incompleteness" — finding ZFC-independent statements in objects mathematicians actually care about
  - TREE(3) cannot even be proven to exist with two trillion pages of Peano-arithmetic proof, and dwarfs Graham's number entirely
  - Embedded Maximality combines two undergraduate concepts on ℚ < and "explodes" into beyond-ZFC territory once you add identity at the edges
  - The divine consistency proof turns the ancient positive/negative-property theology into ultrafilters, with "angels" as definability-restricted versions of God
  - Reverse mathematics inverts the usual direction — given a theorem, recover exactly which axioms it needs
  - AI may offer a new kind of immortality — a sufficient internet corpus lets the model give interviews after the speaker is gone
