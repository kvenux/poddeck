  Tommy Wood 从突触连接与修剪出发，解释新奇挑战、clutch 状态、练习节奏和注意力如何共同扩展学习能力。对谈进一步区分有氧、间歇和抗阻训练对脑结构的作用，并讨论营养缺口、痴呆风险与脑震荡恢复的证据边界。
core_ideas:
  - 成人学习主要依赖连接强弱与修剪，而非大量生成新神经元
  - 复杂新技能把运动、认知、社交和感觉输入组合起来，更可能产生广泛迁移
  - flow 适合表达成熟技能，费力的 clutch 状态与错误反馈更接近能力扩建区
  - 短时适量运动可为当下认知预热，不同训练形式又对灰质、白质和长期适应各有侧重
  - 营养与补充应优先避免缺乏，通过检测、针对性纠正和复测形成闭环
  - 痴呆风险、重大疾病后的阶梯式下降与脑震荡恢复都存在可干预环节
