summary: |
  Khabib Nurmagomedov 从达吉斯坦的简陋训练馆、父亲的教育方式与 29–0 生涯出发，解释冠军如何由教练、同伴、纪律和长期比赛经验共同塑造。
  对谈也深入 Conor 与 Gaethje 两场关键比赛、Islam 的传承链、足球中的伟大竞争，以及信仰如何帮助他面对父亲离世、名声与财富。
core_ideas:
  - 达吉斯坦的优势不是单纯吃苦，而是教练传统、高密度同伴与清晰晋级梯队构成的训练系统
  - 厌恶失败驱动 Khabib 把赛前百日的出行、休息与每日多次训练全部围绕备战安排
  - 父亲用跨项目比赛、阅读复述、劳动与严格兑现承诺，同时塑造运动员与完整人格
  - Conor 之战的关键是把真实情绪延后到计划完成之后，Gaethje 之战则是悲伤、伤病与退役承诺的叠加
  - Khabib、Islam 与年轻队员形成持续传承链，个人离开后训练系统仍把下一代推向前端
  - 信仰为礼拜、失去、成功与财富建立排序，使竞技成就不成为生活的最高目的
