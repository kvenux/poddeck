summary: |
  Becca Tarnas traces the cumulative parallels between Carl Jung’s Red Book and J.R.R. Tolkien’s visionary writings, then asks what those parallels imply about imagination, archetypes, and creative participation. The conversation also examines active imagination as a practice, the boundary between imaginal experience and psychosis, and the grounding needed to bring inner encounters back into shared life.
core_ideas:
  - The Jung-Tolkien case rests on accumulated parallels in timing, imagery, figures, story patterns, and creative experience.
  - Imagination can be understood as participation between a creator and material that has its own constraints and agency.
  - Active imagination differs from passive daydreaming through conscious entry, dialogue, and engagement.
  - Imaginal experiences require doubt, relational feedback, embodiment, and integration into shared reality.
  - Psyche and rational mind are complementary forms of intelligence that work best in tandem.
