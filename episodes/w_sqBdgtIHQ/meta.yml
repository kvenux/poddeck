summary: |
  《硅谷101》6 月这期 101 Weekly 把上周三件最重要的科技商业事件拆开讲：
  OpenAI 想反过来对微软"狮子大开口"重谈 2019 年的不平等条约——49% 利润分成换 33% 股权、20% 收入分成砍到 10%、收回 Azure 独家权——
  双方都备着所谓的"核弹级选项"；Meta 在 Llama 4 失利后用 143 亿美元收购 Scale AI 49% 股份，把 28 岁的 Alex Wang 抢进新成立的 Superintelligence Lab，
  本质上买的是"founder mode 创始人基因"；以及泡泡玛特两年股价 20 倍、海外同比 480% 增长背后，LABUBU 这个"北欧精灵 + 中国供应链"IP 怎么先在东南亚再到欧美最后返攻国内。
core_ideas:
  - OpenAI 2019 年那份合约对微软极有利、对自己极不利——强大起来后第一件事就是"解决历史遗留问题"
  - OpenAI 头上悬两把剑——Microsoft 谈判 + 非营利转营利，今年年底前转型失败将失去包括软银在内的上百亿风投
  - 双方都备好"核弹级选项"——OpenAI 想告微软反垄断，微软可以直接离桌把现有合约维持到 2030 拿走 350 亿
  - Meta 不缺钱不缺 GPU 不缺 researcher，扎克伯格买 Scale AI 本质上是买 Alex Wang 的"创始人基因"来解组织架构问题
  - Scale 真正的护城河是端到端"白手套"+ 速度——bug 上午发现下午解决，大厂同一件事走 ticket 流程要两周
  - LABUBU 不是中国文化、是龙家升把北欧精灵萌化——东南亚→欧美→国内的"回旋镖"路径，搭配泡泡玛特的材质、调性、盲盒、本地伙伴四件事
  - 泡泡玛特对标"开创品类的芭比" + "三层收入的 Hello Kitty"——王宁的判断是真正的品牌"盖住 logo 也认得出"
