summary: |
  硅谷101 用 2025 年特朗普关税战为切入点，复盘苹果如何在两次贸易战之间逐步搬动一张跨越四大洲的供应链。从 2011 年乔布斯对奥巴马说"不能"、库克 2012 年因为螺丝钉栽在德州奥斯汀，到 2018 年的"3+3 双供应链"和印度/越南/巴西的产能转移。
  采访 Rest of World 记者 Viola Zhou 把"印度良率 85-88% vs 中国 98%"、"NPI 流程没法照搬"、"越南是中国供应链的溢出"等业内观察讲透。
core_ideas:
  - 在美国，模具工程师"开个会都坐不满一个房间"；在中国"能填满好几个足球场"——苹果一直没有把宝押在美国生产上的根本原因。
  - 库克的两手策略：稳住白宫（"我们都是在经营一家成功的美国公司"）+ 转移供应链（3+3 战略：中国 3 家 + 海外 3 家）。
  - NPI（新品导入）流程一直只在中国发生——印度复制了产线，但复制不了那段"工程师和代工厂一起把流程打磨出来"的研究过程。
  - 印度的良率长期 85-88%，中国郑州富士康保持 98%——"每 1000 万部，印度报废 120 万 vs 中国报废 20 万"。
  - 越南不是"承接转移"而是"中国供应链的溢出"——干活的是同一批中国工程师，但越南工业用地租金已经超过上海跟深圳。
  - 6000 万部 / 年（苹果美国市场销量）的 80% 仍在中国生产；2026 年底前转印度的计划意味着印度产能要在 1.5 年内翻倍。
  - 即使把生产线搬出中国，原材料（IC 芯片、塑料、模具）仍来自中国——"实际上只是把供应链拉长了，真正的依赖并没有消失"。
