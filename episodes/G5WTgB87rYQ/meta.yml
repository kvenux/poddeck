summary: |
  Caitlin Kalinowski has shipped flagship hardware at three legendary companies — the original
  unibody MacBook Pro and MacBook Air at Apple, the Quest / Rift / Orion AR program at Meta, and
  most recently OpenAI's robotics division (which she publicly resigned from over the "department
  of war" deal). She walks Lenny through why hardware is fundamentally different from software
  ("we only get to compile four or five times — ever"), the 5-layer supply-chain stack that's been
  outsourced over 25 years, Palmer Luckey's drones-vs-aircraft-carriers argument, the impulse
  equation that governs robot safety, the "memory-price meteor" coming for every physical AI
  startup, and the four hardware design principles she carries from Apple to Meta to OpenAI.
core_ideas:
  - One technological lineage — VR → AR → robotics share the same SLAM, depth-sensing, and spatial-perception stack; the VR investment was never wasted
  - We only get to compile four or five times — hardware's defining constraint, vs software's continuous deploy
  - The 5-layer supply chain — raw materials → magnet processing → actuators → sub-assemblies → robots, every layer offshored over 25 years
  - Robot safety as physics — impact = arm-mass × velocity + actuator torque, then compliance; today's warning is "no human within 3 ft"
  - Four hardware design principles — define goals up front, design the hardest part first, over-iterate touch points, do it right now
  - Why not 100×? — the Sam Altman habit Caitlin took with her
  - The bar he held was not wavering — the Steve Jobs habit, and why hearing it once is enough
  - Decisions at the lowest level possible — the Zuckerberg habit that kept Meta's hardware org fast
  - There's a meteor called memory prices — DRAM doubling, AI data centers eating supply, advice to startups is pre-buy
  - I want codecs for engineering — AI is on the edge of real CAD but not in it, and the bottleneck is proprietary CAD data
  - Humanoids are not the answer to everything — a dedicated screw-driver robot beats a generalist for the laptop assembly line
  - The third path after OpenAI — public exit over the "department of war" deal, framed as a boundary, not scorched earth
