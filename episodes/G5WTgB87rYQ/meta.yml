summary: |
  Caitlin Kalinowski曾在三家传奇公司交付旗舰硬件——Apple的初代一体式MacBook Pro和MacBook Air、Meta的Quest/Rift/Orion AR项目，以及最近因"战争部门"协议公开辞职的OpenAI机器人部门。她与Lenny深入探讨了为什么硬件与软件有根本性的不同（"我们只能编译四五次——一辈子就这些"），被外包25年的5层供应链结构，Palmer Luckey的无人机vs航母论述，决定机器人安全性的冲量方程，即将冲击每家物理AI创业公司的"内存价格陨石"，以及她从Apple到Meta再到OpenAI一路带着的四条硬件设计原则。
core_ideas:
  - 一脉相承的技术谱系——VR→AR→机器人共享同一套SLAM、深度感知和空间感知技术栈；VR的投入从未白费
  - 只能编译四五次——硬件的决定性约束，对比软件的持续部署
  - 5层供应链——原材料→磁铁加工→执行器→子组件→机器人，每一层在25年里被外包出去
  - 机器人安全即物理——冲击力 = 臂质量×速度 + 执行器扭矩，再叠加顺从性；当前的警示是"3英尺内不得有人"
  - 硬件设计四原则——提前定义目标，先攻最难的部分，在触点处过度迭代，现在就去做
  - 为什么不是100倍？——Caitlin带走的Sam Altman习惯
  - 他坚守的标准从不动摇——Steve Jobs的习惯，以及被说一次就够了
  - 决策在最低层作出——让Meta硬件团队保持速度的Zuckerberg习惯
  - 内存价格陨石——DRAM价格翻倍，AI数据中心吞噬供给，给创业公司的建议是提前备货
  - 我想要工程编解码器——AI处于真实CAD的边缘而非内部，瓶颈在于专有CAD数据
  - 人形机器人不是万能答案——专用拧螺丝机器人比通才更适合笔记本装配线
  - 离开OpenAI后的第三条路——因"战争部门"协议公开离职，定义为立场而非玉石俱焚
