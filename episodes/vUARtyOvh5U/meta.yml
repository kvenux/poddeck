core_ideas:
  - Three acts — save time, save money, save lives — stacked on the same ambient surface
  - Air conditioning UX — proactive prep beats reactive alerts; 90% of healthcare alerts are ignored
  - Prior-auth in-visit nudge as the killer use case for collapsing weeks of latency into minutes
  - Constellation of models — cheap fast triage hands off to large model only when stakes are high
  - 100M conversations as exhaust — proprietary post-training plus "the conversation is the agent trace"
  - The EHR as a file system — Abridge rides the foundation-model agentic-tool-use curve
  - Counter-take — healthcare ships the hardest AI first because 80/20 simply does not work
  - Janie's hot take — PRDs are not dead; in a world of noise, crisp written clarity matters more
