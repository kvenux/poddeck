summary: |
  Latent Space × Supervised Learning联合节目，嘉宾为Abridge的Janie Lee和Chai Asawa。Abridge是一个拥有约1亿次医疗对话数据集的AI临床智能层。深入探讨了"空调"设计哲学、支撑实时就诊中指导的模型星座架构、HIPAA级去标识化为何是单向的，以及PRD绝未死亡这一热门观点。
core_ideas:
  - 三幕剧——节省时间、省钱与救命——叠加在同一个环境感知层面上
  - 空调UX——主动准备优于被动警报；医疗系统90%的警报被忽略
  - 就诊中预授权提示作为将数周延迟压缩为几分钟的核心用例
  - 模型星座——廉价快速分诊仅在高风险时刻才移交给大模型
  - 1亿次对话作为"废气"——专有后训练加上"对话即智能体轨迹"
  - EHR即文件系统——Abridge搭上基础模型智能体工具使用能力进化的便车
  - 反直觉——医疗率先攻克最难的AI，因为80/20根本行不通
  - Janie的热门观点——PRD没有死；在噪音充斥的世界里，清晰的书面表达比以往更重要
