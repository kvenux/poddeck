summary: |
  Alan Castel 从记忆的重构性、错误驱动学习与健康遗忘讲起，解释为什么熟悉感和高置信并不等于准确。
  对谈进一步讨论认知老化、运动和平衡、主观年龄、好奇心、目的感与社会连接，给出一套跨年龄的学习与适应视角。
core_ideas:
  - 记忆是对过去的重构，高置信不必然意味着高准确
  - 先检索、允许犯错并获得及时反馈，比重复观看更能促进学习
  - 遗忘过期信息是情境更新的一部分，不是单纯失败
  - 认知老化并非所有能力同步下降，选择性与既有知识可以成为优势
  - 运动、平衡、目的感、态度与社会连接共同影响晚年认知表现
