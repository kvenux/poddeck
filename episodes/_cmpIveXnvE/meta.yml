summary: |
  基于约 6,000 名技术行业从业者的年度调查，Noam Segal 解释了 AI 如何同时放大能力、重写职业身份并推高倦怠。对谈还拆解了效率与质量的背离、初级职业阶梯的松动、经理的重要性，以及个人和组织可以采取的具体行动。
core_ideas:
  - AI 身份立场把技术工作者分成被放大、被重定义、失稳和被削弱的不同体验
  - 显著倦怠一年间从 44.7% 升至 54.7%，职业乐观则从 54.8% 降至 48.7%
  - AI 带来的速度主要转化为更高产量与更高预期，并未自动改善质量或减轻工作
  - 初级职业阶梯、设计研究等角色和大型公司员工承受了更明显的负面感受
  - 有效经理是降低倦怠、提高工作享受和管理 AI 工作挤压的关键组织杠杆
