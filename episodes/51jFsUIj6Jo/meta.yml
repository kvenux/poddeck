summary: |
  David Wallace 与 Emily Adlam 围绕波函数、多世界解释与关系量子力学展开正面交锋：争点不是量子力学是否成功，而是分支概率能否支撑我们对它的经验确认。
  对谈进一步延伸到量子引力、可检验的坍缩模型、科学实在论与主体间性，呈现两种互相尊重却风险排序相反的哲学物理学方法。
core_ideas:
  - 波函数可以编码系统属性，也可能主要承担生成未来预测的角色
  - Everett 的应用优势与概率确认难题必须被分开评价
  - 完全保留形式主义的关系主义容易重新靠近 Everett，并继承其认识论压力
  - 量子引力的子系统计算可以成功，但参考系与宇宙整体仍构成概念边界
  - 坍缩模型把解释分歧变成可检验的新物理问题
  - 科学主体间性要求解释观察者如何交流、复核并形成共享知识
