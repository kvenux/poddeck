summary: |
  101 Weekly 第一期。陈茜联合硅谷与纽约的特约研究员,用三十分钟讲完一周三件事:苹果在 WWDC 2025 上把 AI 期待"降级",回到设计与体验、但藏了 Foundation Models API 这步大棋;特斯拉 6 月 22 日在德州奥斯汀首发 Robotaxi,Q1 财报 4.09 亿净利润背后是 5.95 亿碳积分,投资人已经把它当 AI 公司估值;Hailey Bieber 的 Rhode 用三年时间以 10 亿美元卖给 e.l.f. Beauty,标志着"网红品牌 2.0"时代来临。
core_ideas:
  - 苹果在 WWDC 2025 上承认了去年 AI 大饼的失误,把重点拉回设计与体验,但实际上是在赌"端侧模型 + 数据飞轮"这条与 OpenAI 完全不同的赛道
  - Foundation Models API 让 App 开发者三行代码即可调用 Apple Intelligence——这才是 WWDC 真正的大新闻,苹果 AI 生态繁荣的第一步
  - 特斯拉 2025 Q1 净利润 4.09 亿美元里有 5.95 亿来自碳积分,减掉之后造车业务实际亏损;"大而美"法案若通过会再砍掉 32 亿美元利润
  - 6 月 22 日 Robotaxi 首发的核心震撼点是它不是 Cybercab,而是售价 3.7 万美元的 Model Y——意味着所有 Hardware 4 存量车都可成为运营车队
  - 特斯拉纯视觉 vs Waymo 多传感器是两种技术哲学,Waymo 付费乘车从 2023 年末 100 万次涨到 2025 年 5 月的 1000 万次,证明消费者正在养成习惯
  - Hailey Bieber 的 Rhode 不是"明星脸代工厂",而是"网红品牌 2.0":创始人本人下场、Clean Girl 美学、极简产品线、社群与价值观叙事
