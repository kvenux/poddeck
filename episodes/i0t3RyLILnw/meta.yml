summary: |
  从 2015 年苏黎世抓捕回溯 FIFA 腐败网络的形成：商业权利、发展拨款、地方足协与主席选票如何组成自我续命的闭环。节目也讲清了调查记者安德鲁·詹宁斯为何能获得内部证据，以及美国如何借税务、电汇系统和 RICO 打穿瑞士法律与全球足球自治形成的保护层。
core_ideas:
  - 布拉特体系默许区域足坛大佬从赛事权利中获利，换取区域协会的稳定选票
  - 詹宁斯不依赖 FIFA 的采访准入，公开承担代价后赢得内部线人信任
  - 一国一票与商业化资金结合，使发展援助能够被改造成主席连任机器
  - ISL 把转播和赞助权变成回扣来源，误入官方账户的款项留下关键银行存根
  - 非营利协会身份、全球禁赛权与 24 人密室决策共同构成三层保护结构
  - 美国以税务缺口、电汇记录和 RICO 拼出跨国犯罪网络，但改革后的问责仍未完成
