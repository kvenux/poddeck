summary: |
  Eiso Kant 复盘了从早期 code models 失败到 Poolside 模型工厂的路径，并解释为何开放权重还不够，开放研究才真正降低新模型公司的进入门槛。对谈还深入讨论了小模型的持久行为、agent 反哺研究、极简 harness、RL 的日历时间瓶颈，以及开放模型的治理边界。
core_ideas:
  - 模型是端到端研究工厂的产物，竞争力来自可信迭代速度而非单个 checkpoint
  - 开放权重让人使用模型，开放研究让后来者重建能力形成过程
  - 持久、验证与回溯等行为能显著提高较小模型在知识工作中的有效能力
  - 极简 harness 加虚拟机让模型用代码表达循环、条件与状态，比堆叠工具描述更通用
  - 开放路线需要能力级风险评估与公共治理，既不能永远无条件开放，也不应现在就全面封死
