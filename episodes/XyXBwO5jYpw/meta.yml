core_ideas:
  - 奴隶制是战争不可替代的因果核心，但多数北军士兵最初为维护 Union 而战
  - 邦联的胜利门槛是耗尽北方政治意志，而美国必须征服领土并摧毁其军队
  - Lincoln、Grant 与 Lee 的性格和决策显著改变了战争长度、代价与结局
  - 解放从战争手段扩展为制度结果，黑人服役进一步提出公民权与投票权要求
  - Gettysburg、Vicksburg、Atlanta 与 1864 大选共同构成战争的真实转折链
  - 战争结束不等于和解，Lost Cause 与公共纪念继续塑造美国历史记忆
